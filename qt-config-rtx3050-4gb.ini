; Lichii - perfil para laptop RTX 3050 (4 GB VRAM) / 8 GB RAM / Intel Core i5 de 12a gen
;
; Uso: cierra Lichii, haz copia de tu qt-config.ini y copia estos valores a las secciones
; del mismo nombre en:   %APPDATA%\eden\config\qt-config.ini
; (o en  user\config\qt-config.ini  junto a lichii.exe si usas modo portable).
; Si no tienes qt-config.ini todavia, copia este archivo con ese nombre y abre Lichii.
;
; Formato: "clave=valor" y "clave\default=false" (false = "usar mi valor"). Solo se listan
; los ajustes que cambian respecto a lo util en este equipo. Valores de enums = indice numerico.

[Renderer]
; Vulkan (1) sobre la RTX 3050; el dispositivo 0 ya es la NVIDIA (el emulador ordena discretas primero).
backend=1
backend\default=false
vulkan_device=0
vulkan_device\default=false

; Resolucion nativa (1X). En modo portatil = 720p, en dock = 1080p internos.
resolution_setup=3
resolution_setup\default=false

; Filtro de escalado barato: ScaleForce (5). Fsr3 (15, valor de primer arranque) cuesta GPU y VRAM.
scaling_filter=5
scaling_filter\default=false

; Anti-aliasing: FXAA (1) cuesta muy poco. Pon 0 (ninguno) si necesitas mas fps.
anti_aliasing=1
anti_aliasing\default=false

; VSync FifoRelaxed (3): si no llegas a 60 fps no cae a 30 de golpe (puede haber tearing leve).
use_vsync=3
use_vsync\default=false

; Precision de GPU baja (0) y shaders asincronos: menos stutter y menos carga de GPU/CPU.
gpu_accuracy=0
gpu_accuracy\default=false
use_asynchronous_shaders=true
use_asynchronous_shaders\default=false
async_presentation=true
async_presentation\default=false

; Reactive flushing OFF: en una RTX 3050 costaba fps (notas del proyecto, fila 128).
use_reactive_flushing=false
use_reactive_flushing\default=false

; VRAM: texturas ASTC decodificadas en GPU y recomprimidas a BC3 (la RTX no soporta ASTC nativo:
; sin recompresion ocupan 4x-16x mas VRAM). Modo conservador de VRAM para no pasar de ~3.5 GB.
accelerate_astc=1
accelerate_astc\default=false
astc_recompression=2
astc_recompression\default=false
vram_usage_mode=0
vram_usage_mode\default=false

; Caches de shaders en disco: reducen tirones tras la primera vez.
use_disk_shader_cache=true
use_disk_shader_cache\default=false
use_vulkan_driver_pipeline_cache=true
use_vulkan_driver_pipeline_cache\default=false

; Sin frame generation ni DLSS/FSR de juego: no caben en 4 GB / 8 GB sin perder rendimiento.
frame_gen=false
frame_gen\default=false

[Core]
use_multi_core=true
use_multi_core\default=false
use_speed_limit=true
use_speed_limit\default=false
speed_limit=100
speed_limit\default=false

[System]
; Modo portatil (0) = 720p: lo recomendable para esta GPU. Docked (1) = 1080p, ~2.25x de pixeles.
use_docked_mode=0
use_docked_mode\default=false
